name: Build YouMod
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      repo:
        description: 'Repository to build from'
        required: true
        default: 'Sersium/YouMod'
      branch:
        description: 'Branch to build from'
        required: true
        default: 'main'
   
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build YouMod
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout YouMod
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.branch || github.ref_name }}
          repository: ${{ inputs.repo || github.repository }}
          path: YouMod

      - name: Install dependencies
        run: brew install make ldid

      - name: Set PATH environment variables
        run: |
          echo "$(brew --prefix make)/libexec/gnubin" >> $GITHUB_PATH
          echo "THEOS=${{ github.workspace }}/theos" >> $GITHUB_ENV

      # Original from YTweaks
      - name: Get Theos commit
        run: |
          get_commit_hash() {
            local repo_url=$1
            git ls-remote "$repo_url" HEAD | awk '{print substr($1,1,7)}'
          }
          echo "THEOS_COMMIT=$(get_commit_hash "https://github.com/roothide/theos")" >> $GITHUB_ENV

      - name: Cache Theos
        id: cache-theos
        uses: actions/cache@v6
        with:
          path: theos
          key: YouMod-26.5-SDK-${{ env.THEOS_COMMIT }}

      - name: Setup Theos
        if: ${{ steps.cache-theos.outputs.cache-hit != 'true' }}
        run: |
            git clone --quiet --depth=1 --recurse-submodules https://github.com/roothide/theos.git
            git clone --quiet --depth=1 -n --filter=tree:0 https://github.com/Tonwalter888/iOS-SDKs.git
            cd iOS-SDKs
            git sparse-checkout set --no-cone iPhoneOS26.5.sdk
            git checkout --quiet
            mv *.sdk "$THEOS/sdks"
            
      - name: Clone headers
        run: |
          if [ ! -d "$THEOS/include/YouTubeHeader" ]; then
            git clone --quiet --depth=1 https://github.com/PoomSmart/YouTubeHeader.git "$THEOS/include/YouTubeHeader"
          else
            cd $THEOS/include/YouTubeHeader
            git pull --quiet --force
            cd ${{ github.workspace }}
          fi
          
          if [ ! -d "$THEOS/include/PSHeader" ]; then
            git clone --quiet --depth=1 https://github.com/PoomSmart/PSHeader.git "$THEOS/include/PSHeader"
          else
            cd $THEOS/include/PSHeader
            git pull --quiet --force
            cd ${{ github.workspace }}
          fi

      - name: Fix Theos od broken pipe issue
        run: sed -i '' 's/od -c "$i" | head/od -c "$i" 2>\/dev\/null | head/g' $THEOS/bin/convert_xml_plist.sh || true

      - name: Build YouMod
        run: |
          cd YouMod
          echo "YOUMOD_VERSION=$(grep '^Version:' control | cut -d ' ' -f2)" >> $GITHUB_ENV
          make clean package DEBUG=0 FINALPACKAGE=1
          make clean package DEBUG=0 FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
          make clean package DEBUG=0 FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=roothide
          mv packages/*.deb ${{ github.workspace }}

      - name: Cache Decrypted YouTube IPA
        id: cache-ipa
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/youtube.ipa
          key: youtube-ipa-21.38.2

      - name: Download Decrypted YouTube IPA
        if: steps.cache-ipa.outputs.cache-hit != 'true'
        run: |
          curl -fSL "https://archive.org/download/com.google.ios.youtube-21.38.2-544007664-891605195-US_decrypt_1790006718/com.google.ios.youtube-21.38.2-544007664-891605195-US_decrypt_1790006718.ipa" -o ${{ github.workspace }}/youtube.ipa

      - name: Install cyan and tbd
        run: |
          pipx install --force https://github.com/asdfzxcvbn/pyzule-rw/archive/main.zip || true
          sudo wget --quiet --no-verbose "https://github.com/inoahdev/tbd/releases/download/2.2/tbd-mac" -O /usr/local/bin/tbd && sudo chmod +x /usr/local/bin/tbd || true

      - name: Inject YouMod into YouTube IPA
        run: |
          cd ${{ github.workspace }}
          DEB_FILE="dev.water888.youmod_${{ env.YOUMOD_VERSION }}_iphoneos-arm64.deb"

          # Try cyan injection first
          if command -v cyan &>/dev/null; then
            cyan -i youtube.ipa -o YouTube_YouMod.ipa -uwef "$DEB_FILE" -n "YouTube" -b "com.google.ios.youtube" || true
          fi

          # If cyan did not produce YouTube_YouMod.ipa, use direct fallback injection
          if [ ! -f "YouTube_YouMod.ipa" ]; then
            echo "Using direct dylib injection fallback..."
            rm -rf ytextracted
            unzip -q youtube.ipa -d ytextracted
            mkdir -p ytextracted/Payload/YouTube.app/Frameworks

            rm -rf deb_extracted
            mkdir -p deb_extracted
            dpkg-deb -x "$DEB_FILE" deb_extracted/

            cp -r deb_extracted/var/jb/Library/Application\ Support/YouMod.bundle ytextracted/Payload/YouTube.app/ 2>/dev/null || cp -r deb_extracted/Library/Application\ Support/YouMod.bundle ytextracted/Payload/YouTube.app/ 2>/dev/null || true
            find deb_extracted -name "YouMod.dylib" -exec cp {} ytextracted/Payload/YouTube.app/Frameworks/ \;

            if [ -x "$THEOS/bin/opool" ]; then
              "$THEOS/bin/opool" insert -b @rpath/Frameworks/YouMod.dylib -p @executable_path/Frameworks/YouMod.dylib ytextracted/Payload/YouTube.app/YouTube
            fi

            ldid -S ytextracted/Payload/YouTube.app/Frameworks/YouMod.dylib 2>/dev/null || true
            ldid -S ytextracted/Payload/YouTube.app/YouTube 2>/dev/null || true

            cd ytextracted
            zip -qr ../YouTube_YouMod.ipa Payload
            cd ..
          fi

          ls -lh YouTube_YouMod.ipa

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: YouMod v${{ env.YOUMOD_VERSION }}
          path: |
            ${{ github.workspace }}/*.deb
            ${{ github.workspace }}/YouTube_YouMod.ipa
          if-no-files-found: error
          overwrite: true

      - name: Create or update release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ env.YOUMOD_VERSION }}
          name: v${{ env.YOUMOD_VERSION }} 
          files: |
             ${{ github.workspace }}/dev.water888.youmod_${{ env.YOUMOD_VERSION }}_iphoneos-arm.deb
             ${{ github.workspace }}/dev.water888.youmod_${{ env.YOUMOD_VERSION }}_iphoneos-arm64.deb
             ${{ github.workspace }}/dev.water888.youmod_${{ env.YOUMOD_VERSION }}_iphoneos-arm64e.deb
             ${{ github.workspace }}/YouTube_YouMod.ipa
             YouMod/feather.json
          draft: false
