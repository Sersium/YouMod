name: Build YouMod
on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - 'README.md'
      - '*.md'
      - 'feather.json'
      - '.gitignore'
  workflow_dispatch:
    inputs:
      repo:
        description: 'Repository to build from'
        required: true
        default: 'Sersium/YouMod'
      branch:
        description: 'Branch to build from'
        required: true
        default: 'main'
   
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build YouMod
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout YouMod
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.branch || github.ref_name }}
          repository: ${{ inputs.repo || github.repository }}
          path: YouMod

      - name: Install dependencies
        run: brew install make ldid

      - name: Set PATH environment variables
        run: |
          echo "$(brew --prefix make)/libexec/gnubin" >> $GITHUB_PATH
          echo "THEOS=${{ github.workspace }}/theos" >> $GITHUB_ENV

      - name: Get Theos commit
        run: |
          get_commit_hash() {
            local repo_url=$1
            git ls-remote "$repo_url" HEAD | awk '{print substr($1,1,7)}'
          }
          echo "THEOS_COMMIT=$(get_commit_hash "https://github.com/roothide/theos")" >> $GITHUB_ENV

      - name: Cache Theos
        id: cache-theos
        uses: actions/cache@v6
        with:
          path: theos
          key: YouMod-26.5-SDK-${{ env.THEOS_COMMIT }}

      - name: Setup Theos
        if: ${{ steps.cache-theos.outputs.cache-hit != 'true' }}
        run: |
          git clone --quiet --depth=1 --recurse-submodules https://github.com/roothide/theos.git
          git clone --quiet --depth=1 -n --filter=tree:0 https://github.com/Tonwalter888/iOS-SDKs.git
          cd iOS-SDKs
          git sparse-checkout set --no-cone iPhoneOS26.5.sdk
          git checkout --quiet
          mv *.sdk "$THEOS/sdks"
            
      - name: Clone headers
        run: |
          if [ ! -d "$THEOS/include/YouTubeHeader" ]; then
            git clone --quiet --depth=1 https://github.com/PoomSmart/YouTubeHeader.git "$THEOS/include/YouTubeHeader"
          else
            cd $THEOS/include/YouTubeHeader
            git pull --quiet --force
            cd ${{ github.workspace }}
          fi

          rm -rf "$THEOS/include/YTHeaders"
          cp -r "$THEOS/include/YouTubeHeader" "$THEOS/include/YTHeaders"
          
          if [ ! -d "$THEOS/include/PSHeader" ]; then
            git clone --quiet --depth=1 https://github.com/PoomSmart/PSHeader.git "$THEOS/include/PSHeader"
          else
            cd $THEOS/include/PSHeader
            git pull --quiet --force
            cd ${{ github.workspace }}
          fi

      - name: Fix Theos od broken pipe issue
        run: sed -i '' 's/od -c "$i" | head/od -c "$i" 2>\/dev\/null | head/g' $THEOS/bin/convert_xml_plist.sh || true

      - name: Clone Safe Extra Tweaks
        run: |
          cd ${{ github.workspace }}
          git clone --quiet --depth=1 https://github.com/PoomSmart/YTVideoOverlay.git
          git clone --quiet --depth=1 https://github.com/therealFoxster/DontEatMyContent.git

      - name: Build Safe Extra Tweaks
        run: |
          cd ${{ github.workspace }}

          # Build YTVideoOverlay
          cd YTVideoOverlay
          make clean package DEBUG=0 FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
          mv packages/*.deb ${{ github.workspace }}/ytvo.deb
          cd ${{ github.workspace }}

          # Build DontEatMyContent
          cd DontEatMyContent
          make clean package DEBUG=0 FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
          mv packages/*.deb ${{ github.workspace }}/demc.deb
          cd ${{ github.workspace }}

      - name: Build YouMod
        run: |
          cd YouMod
          VERSION=$(grep '^Version:' control | cut -d ' ' -f2)
          echo "YOUMOD_VERSION=$VERSION" >> $GITHUB_ENV

          # Build rootless deb for IPA injection
          make clean package DEBUG=0 FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
          mv packages/*.deb ${{ github.workspace }}/youmod.deb

          # Build rootful and roothide debs for jailbreak release assets
          make clean package DEBUG=0 FINALPACKAGE=1
          mv packages/*.deb ${{ github.workspace }}/dev.water888.youmod_${VERSION}_iphoneos-arm.deb
          make clean package DEBUG=0 FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=roothide
          mv packages/*.deb ${{ github.workspace }}/dev.water888.youmod_${VERSION}_iphoneos-arm64e.deb

      - name: Cache Decrypted YouTube IPA
        id: cache-ipa
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/youtube.ipa
          key: youtube-ipa-21.38.2

      - name: Download Decrypted YouTube IPA
        if: steps.cache-ipa.outputs.cache-hit != 'true'
        run: |
          curl -fSL "https://archive.org/download/com.google.ios.youtube-21.38.2-544007664-891605195-US_decrypt_1790006718/com.google.ios.youtube-21.38.2-544007664-891605195-US_decrypt_1790006718.ipa" -o ${{ github.workspace }}/youtube.ipa

      - name: Install cyan and tbd
        run: |
          pipx install --force https://github.com/asdfzxcvbn/pyzule-rw/archive/main.zip || true
          sudo wget --quiet --no-verbose "https://github.com/inoahdev/tbd/releases/download/2.2/tbd-mac" -O /usr/local/bin/tbd && sudo chmod +x /usr/local/bin/tbd || true

      - name: Inject Tweaks into YouTube IPA
        run: |
          cd ${{ github.workspace }}

          echo "Injecting safe rootless tweaks: youmod.deb demc.deb ytvo.deb"
          # -u (remove UISupportedDevices), -w (no watch), -e (remove extensions), -s (fakesign with ldid), -q (thin to arm64)
          if command -v cyan &>/dev/null; then
            cyan -i youtube.ipa -o YouTube_YouMod.ipa -uwesq -f youmod.deb demc.deb ytvo.deb -n "YouTube" -b "com.google.ios.youtube" || true
          fi

          # If cyan did not produce YouTube_YouMod.ipa, use direct fallback injection
          if [ ! -f "YouTube_YouMod.ipa" ]; then
            echo "Using direct dylib injection fallback..."
            rm -rf ytextracted
            unzip -q youtube.ipa -d ytextracted
            mkdir -p ytextracted/Payload/YouTube.app/Frameworks

            for d in youmod.deb demc.deb ytvo.deb; do
              rm -rf deb_extracted
              mkdir -p deb_extracted
              dpkg-deb -x "$d" deb_extracted/

              cp -r deb_extracted/var/jb/Library/Application\ Support/*.bundle ytextracted/Payload/YouTube.app/ 2>/dev/null || cp -r deb_extracted/Library/Application\ Support/*.bundle ytextracted/Payload/YouTube.app/ 2>/dev/null || true
              find deb_extracted -name "*.dylib" -exec cp {} ytextracted/Payload/YouTube.app/Frameworks/ \;
            done

            for dylib in ytextracted/Payload/YouTube.app/Frameworks/*.dylib; do
              dylib_name=$(basename "$dylib")
              if [ -x "$THEOS/bin/opool" ]; then
                "$THEOS/bin/opool" insert -b "@rpath/Frameworks/$dylib_name" -p "@executable_path/Frameworks/$dylib_name" ytextracted/Payload/YouTube.app/YouTube
              fi
              ldid -S "$dylib" 2>/dev/null || true
            done

            ldid -S ytextracted/Payload/YouTube.app/YouTube 2>/dev/null || true

            cd ytextracted
            zip -qr ../YouTube_YouMod.ipa Payload
            cd ..
          fi

          ls -lh YouTube_YouMod.ipa

          IPA_SIZE=$(stat -f%z YouTube_YouMod.ipa 2>/dev/null || stat -c%s YouTube_YouMod.ipa)
          echo "IPA size: $IPA_SIZE"
          python3 -c "
          import json
          from datetime import datetime, timezone

          with open('YouMod/feather.json', 'r') as f:
              data = json.load(f)

          app = data['apps'][0]
          ym_ver = '${{ env.YOUMOD_VERSION }}'
          yt_ver = '21.38.2'
          ver_str = f'{yt_ver}-{ym_ver}'
          ipa_size = int('$IPA_SIZE')
          download_url = f'https://github.com/Sersium/YouMod/releases/download/v{ym_ver}/YouTube_YouMod.ipa'
          now_iso = datetime.now(timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ')

          new_entry = {
              'version': ver_str,
              'date': now_iso,
              'downloadURL': download_url,
              'size': ipa_size,
              'localizedDescription': f'YouMod v{ym_ver}: Universal DeArrow titles, web-style feed indicator, RYD action bar & details dislike counters, feed audio ON & CC disabled, and embedded tweak preferences.'
          }

          versions = app.get('versions', [])
          filtered = [v for v in versions if v.get('version') != ver_str]
          app['versions'] = [new_entry] + filtered

          app['version'] = ver_str
          app['versionDate'] = now_iso
          app['versionDescription'] = new_entry['localizedDescription']
          app['downloadURL'] = download_url
          app['size'] = ipa_size

          with open('YouMod/feather.json', 'w') as f:
              json.dump(data, f, indent=2)
          "

          # Commit and push updated feather.json to main
          cd YouMod
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add feather.json
          git commit -m "Update feather.json with v${{ env.YOUMOD_VERSION }} [skip ci]" || true
          git push origin main || true
          cd ..

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: YouMod v${{ env.YOUMOD_VERSION }}
          path: |
            ${{ github.workspace }}/*.deb
            ${{ github.workspace }}/YouTube_YouMod.ipa
            YouMod/feather.json
          if-no-files-found: error
          overwrite: true

      - name: Create or update release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ env.YOUMOD_VERSION }}
          name: v${{ env.YOUMOD_VERSION }} 
          files: |
             ${{ github.workspace }}/youmod.deb
             ${{ github.workspace }}/ytvo.deb
             ${{ github.workspace }}/demc.deb
             ${{ github.workspace }}/dev.water888.youmod_${{ env.YOUMOD_VERSION }}_iphoneos-arm.deb
             ${{ github.workspace }}/dev.water888.youmod_${{ env.YOUMOD_VERSION }}_iphoneos-arm64e.deb
             ${{ github.workspace }}/YouTube_YouMod.ipa
             YouMod/feather.json
          draft: false
